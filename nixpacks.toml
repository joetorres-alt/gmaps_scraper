[phases.setup]
nixPkgs = ["chromium", "glib", "nss", "nspr", "atk", "cups", "dbus", "expat",
           "libdrm", "libxcb", "libxkbcommon", "mesa", "pango", "cairo",
           "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage",
           "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr",
           "xorg.libxshmfence"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium"
]

[start]
cmd = "python app.py"
