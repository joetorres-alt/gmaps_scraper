[phases.setup]
nixPkgs = [
  "chromium", "glib", "nss", "nspr", "atk", "at-spi2-atk", "cups",
  "dbus", "expat", "libdrm", "libxcb", "libxkbcommon", "mesa", "pango",
  "cairo", "alsa-lib", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage",
  "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxshmfence",
  "xorg.libXScrnSaver", "gtk3"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium --with-deps"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300"
